# Config for the full HDFS dataset (LogHub HDFS_v1, ~11M lines, labelled per block).
# Every pipeline step reads its settings from here.
# Sections marked "Stage N" are starting values; each is finalised in the stage that uses it.
# For quick experiments on 2,000 lines, use configs/hdfs_sample.yaml instead.

dataset: hdfs                     # picks the adapter (src/logad/adapters/hdfs.py)
seed: 42                          # fixed random seed → reproducible results

paths:
  raw_dir: data/raw/hdfs          # filled by `logad download`
  artifacts_dir: artifacts/hdfs   # parsed logs, feature matrices, trained models
  reports_dir: reports/hdfs       # charts and results tables

data:                             # Stage 1: where the raw data comes from
  files:                          # downloaded into raw_dir; only official LogHub hosts
    - url: https://zenodo.org/records/8196385/files/HDFS_v1.zip?download=1
      filename: HDFS_v1.zip       # 187 MB zip → ~1.5 GB unzipped
      checksum: md5:76a24b4d9a6164d543fb275f89773260   # published by Zenodo
      extract: true
  log_file: HDFS.log              # relative to raw_dir
  label_file: preprocessed/anomaly_label.csv   # BlockId,Label (Normal/Anomaly)

grouping:                         # Stage 3: how log lines are grouped into samples
  method: session                 # HDFS: one sample per block_id (the adapter's group_id)

parsing:                          # Stage 2: masking + Drain log parser
  sim_threshold: 0.4              # share of tokens that must match to join a template
  depth: 4                        # depth of Drain's parse tree
  masks:                          # regexes replaced BEFORE Drain, in this order
    - name: BLK                   # HDFS block ID(s): blk_-1608999687919862906, or a list of them
      pattern: 'blk_-?\d+( +blk_-?\d+)*'   # a list of blocks is ONE variable
    - name: IP                    # IPv4 with optional port, e.g. 10.250.19.102:54106
      pattern: '(\d+\.){3}\d+(:\d+)?'
    - name: NUM                   # any remaining number (sizes, thread IDs, ...)
      pattern: '\d+'

features:                         # Stage 3: event-count matrix per block
  type: event_count               # event_count | tfidf (IDF weights learned on train only)
  scale: false                    # true → zero mean, unit variance per event (train only)
  split:                          # by TIME (block's first line): train, validation, test
    train: 0.6                    # oldest 60%: models learn from this
    validation: 0.2               # next 20%: pick alert thresholds (Stage 5); test = rest

models:                           # Stage 4: fitted on the TRAIN split only, never on labels
  baseline: {}                    # rare-event rule: score = rarity of the block's rarest event
  pca:                            # Xu et al. 2009: score = error rebuilding the block
    transform: tfidf              # per-model override of features.type (rare events count more)
    variance_kept: 0.95           # keep components explaining 95% of normal variance
  isolation_forest:               # score = how quickly random splits isolate the block
    transform: event_count
    n_estimators: 100
  autoencoder:                    # Stage 6, needs PyTorch (requirements-torch.txt)
    transform: tfidf              # score = error rebuilding the block (45 → 32 → 8 → 32 → 45)
    scale: true                   # neural networks need scaled inputs
    hidden: 32
    bottleneck: 8
    epochs: 30                    # upper limit; early stopping usually ends sooner
    batch_size: 512
    learning_rate: 0.001
    patience: 3                   # stop after 3 epochs without improvement on held-out train
